<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px 20px;
        }
        h1 {
            font-size: 80px;
            margin: 0;

        p {
            font-size: 16px;

            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #DB572E;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 4px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        .btn:hover {
